<head>

    <title>Reproductor Stream</title>
    <style>
        body {
            margin: 0;
            padding: 0;

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

        <!-- Se añaden permisos comunes para reproductores de video -->
        <iframe 
            src="https://streamx061.sbs/global1.php?channel=disney1"

    </div>

</body>
